name: Tests (Windows x64)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "crates/**"
      - "src-tauri/**"
      - "sidex-extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: cargo test (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: test-win-x64

      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

  extension-smoke:
    name: Extension install smoke test (network)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: smoke-win-x64

      - name: Verify marketplace base URL
        run: cargo test --manifest-path crates/sidex-extensions/Cargo.toml --test marketplace_install default_marketplace_base_url_is_open_vsx --target x86_64-pc-windows-msvc

      - name: Install extension from Open VSX and assert files on disk
        run: cargo test --manifest-path crates/sidex-extensions/Cargo.toml --test marketplace_install --target x86_64-pc-windows-msvc -- --ignored --test-threads=1
