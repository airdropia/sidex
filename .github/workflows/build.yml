name: Build Check (Windows x64)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "crates/**"
      - "src-tauri/**"
      - "sidex-extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check + clippy (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: check-win-x64

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
