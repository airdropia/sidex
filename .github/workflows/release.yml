name: Release (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: release-win-x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup built-in extensions
        shell: bash
        run: bash scripts/setup-extensions.sh

      - name: Bundle Node.js runtime
        shell: pwsh
        run: |
          $version = "22.14.0"
          $zip = Join-Path $env:RUNNER_TEMP "node.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "node-expanded"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          New-Item -ItemType Directory -Path "src-tauri/extension-host" -Force | Out-Null
          Copy-Item "$expanded/node-v$version-win-x64/node.exe" "src-tauri/extension-host/node.exe" -Force
          if (-not (Test-Path "src-tauri/extension-host/node.exe")) { throw "Bundled Node runtime missing" }

      - name: Build frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: npm run build

      - name: Build Tauri app (NSIS + MSI)
        timeout-minutes: 45
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target \( -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/
          count=$(ls dist-artifacts/ 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No installer artifacts were produced (NSIS/MSI missing); aborting release"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-artifacts/
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          files: dist-artifacts/**
