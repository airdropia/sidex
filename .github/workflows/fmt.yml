name: Formatting

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (diagnostic)
        run: |
          npx prettier --write 'src/**/*.{ts,tsx,js,json}' >/dev/null 2>&1 || true
          git diff -- '*.ts' '*.tsx' '*.js' '*.json' | head -120 | while IFS= read -r line; do echo "::error file=prettier::$line"; done || true

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting (diagnostic)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all 2>&1 || true
          git diff -- '*.rs' | head -120 | while IFS= read -r line; do echo "::error file=rustfmt::$line"; done || true

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Check TOML formatting
        run: taplo fmt --check --diff
